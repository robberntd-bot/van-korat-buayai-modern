<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ข่าวสารรถตู้พรทวีชัย</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>ข่าวสาร</h1>
  <p>รถตู้พรทวีชัย โคราช-บัวใหญ่</p>
</header>
<nav>
  <ul>
    <li><a href="index.html">หน้าแรก</a></li>
    <li><a href="schedule.html">ตารางเวลา</a></li>
    <li><a href="news.html" class="active">ข่าวสาร</a></li>
  </ul>
</nav>
<div class="container" id="newsContainer"></div>
<footer>บริษัท พรทวีชัยราชสีมา จำกัด</footer>
<script>
fetch('data/news.json').then(r=>r.json()).then(news=>{
  document.getElementById('newsContainer').innerHTML = news.map(n=>`
    <div class="card">
      <h2>${n.title}</h2>
      <p>${n.description}</p>
    </div>
  `).join('') || '<div class="card">ยังไม่มีข่าวสาร</div>';
});
</script>
</body>
</html>
